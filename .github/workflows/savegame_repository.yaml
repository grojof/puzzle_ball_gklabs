name: savegame_repository

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs only when the package changes, to keep CI minutes low.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/savegame_repository/**"
      - ".github/workflows/savegame_repository.yaml"

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1
    with:
      dart_sdk: "3.13.5"
      working_directory: packages/savegame_repository
