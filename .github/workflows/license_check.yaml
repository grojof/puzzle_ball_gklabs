name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - "packages/*/pubspec.yaml"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      flutter_version: "3.47.x"
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      # pubspec_lock_parse (transitive, via the bloc_lint dev dependency) is Apache-2.0,
      # but its LICENSE holds only the short notice, so the license is not detected.
      skip_packages: "pubspec_lock_parse"
