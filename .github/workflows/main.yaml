name: ball_odyssey

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every change reaches main through a pull request, so there is no push trigger.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only changes skip the Flutter build; pr_checks.yaml still spell-checks them.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
      - ".claude/**"
      - "LICENSE"
      - ".github/cspell.json"
  workflow_dispatch:

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      flutter_version: "3.47.x"
      run_bloc_lint: true
      # The app is being rebuilt; the threshold rises as each part lands with its tests
      # (ADR-0005): 71.8 % after rebuild-runtime-audio-settings, whose untested remainder is
      # the menus the next change replaces. Packages get their own jobs at 100 %.
      min_coverage: 70
