# Serves the Flutter web build (see the Dockerfile at the repository root).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               application/wasm image/svg+xml;

    # Flutter does not version main.dart.js or flutter_bootstrap.js: every
    # file is revalidated with its ETag, so a redeploy is picked up at once.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;

    # go_router's paths are served by the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
