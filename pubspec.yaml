name: puzzle_ball_gklabs
description: Ball Odyssey, a physics ball game with procedurally generated levels.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  audioplayers: ^6.8.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  flame: ^1.38.2
  flame_forge2d: ^0.20.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.2
  material_ui: ^1.7.0
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  bloc_lint: ^0.4.3
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.25
  build_runner: ^2.16.1
  flame_test: ^2.3.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/images/components/
    - assets/images/parallax/
    - assets/licenses/poppins/

flutter_native_splash:
  # Usa una imagen de fondo completa que cubre todo (fondo + icono en uno)
  background_image: assets/images/splash_screen.png

  android_12:
    # Para Android 12+, debes seguir usando una imagen separada como ícono.
    # Sin embargo, como tu imagen es una única splash completa, puedes dejar esto vacío.
    # La imagen se verá algo recortada si la defines aquí, así que lo omitimos.
    # En cambio, dejamos solo el fondo.

    # Opcional: color de fondo para Android 12
    color: "#0b1627"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#0b1627"
    theme_color: "#0b1627"